# docker-compose.yml
name: auto-claude

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auto-claude
    ports:
      - "9000:9000"
    volumes:
      # Mount user's projects (read-write for agent work)
      - ${PROJECTS_PATH:-./projects}:/projects
      # Persistent data
      - auto-claude-data:/data
      # Claude CLI config (for OAuth tokens)
      - auto-claude-claude:/home/claude/.claude
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - SECURITY_STRICT_MODE=${SECURITY_STRICT_MODE:-true}
      - GRAPHITI_ENABLED=${GRAPHITI_ENABLED:-true}
      - GRAPHITI_LLM_PROVIDER=ollama
      - GRAPHITI_EMBEDDER_PROVIDER=ollama
      - GRAPHITI_DATABASE=auto_claude_memory
      - GRAPHITI_DB_PATH=/data/memories
      # Connect to internal Ollama service
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_LLM_MODEL=deepseek-r1:7b
      - OLLAMA_EMBEDDING_MODEL=embeddinggemma
      - OLLAMA_EMBEDDING_DIM=768
      - OPENAI_API_KEY=ollama
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    depends_on:
      falkordb:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    networks:
      - auto-claude-net

  ollama:
    image: ollama/ollama:latest
    container_name: auto-claude-ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - auto-claude-net
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-init:
    image: ollama/ollama:latest
    container_name: auto-claude-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    environment:
      - OLLAMA_HOST=ollama:11434
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/init-ollama.sh:/init-ollama.sh
    command: [ "/init-ollama.sh" ]
    networks:
      - auto-claude-net

  falkordb:
    image: falkordb/falkordb:latest
    container_name: auto-claude-falkordb
    volumes:
      - falkordb-data:/data
    networks:
      - auto-claude-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  graphiti-mcp:
    image: falkordb/graphiti-knowledge-graph-mcp:latest
    container_name: auto-claude-graphiti
    platform: linux/amd64
    environment:
      DATABASE_TYPE: falkordb
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      LLM_PROVIDER: ollama
      EMBEDDER_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_LLM_MODEL: deepseek-r1:7b
      OLLAMA_EMBEDDING_MODEL: embeddinggemma
      OLLAMA_EMBEDDING_DIM: 768
      OPENAI_API_KEY: ollama
    depends_on:
      falkordb:
        condition: service_healthy
    networks:
      - auto-claude-net

volumes:
  auto-claude-data:
  auto-claude-claude:
  falkordb-data:
  ollama_data:


networks:
  auto-claude-net:
    driver: bridge
